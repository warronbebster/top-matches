<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Best Matches of 2026</title>
    <meta name="description" content="Pick and rank your top 10 tennis matches of 2026." />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🎾%3C/text%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@400;500;600;700&display=swap"
    />
    <!-- Same Adobe Fonts kit as served.bracket.tennis (obviously-narrow); only loads on domains the kit allows. -->
    <link rel="stylesheet" href="https://use.typekit.net/vxt7obb.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page">
      <div class="layout">
        <section class="hero">
          <img class="logo" src="assets/served-logo.png" alt="Served with Andy Roddick" width="96" height="33" />
          <h1>Best Matches of 2026</h1>
          <p class="countdown" id="countdown" hidden></p>
          <p class="lede">Pick the ten best matches of the season, put them in order, and send in your list.</p>
        </section>

        <div class="view-tabs" role="tablist" aria-label="View">
          <button type="button" role="tab" id="tab-catalog" data-tab="catalog" aria-selected="true">Matches</button>
          <button type="button" role="tab" id="tab-picks" data-tab="picks" aria-selected="false">My top 10 <span class="tab-count" id="tab-count">0</span></button>
        </div>

        <section class="picks" aria-labelledby="picks-title">
          <div class="section-head">
            <h2 id="picks-title" class="display">My top 10</h2>
            <div class="head-tools">
              <button type="button" class="link-btn muted" id="clear-btn">Clear</button>
              <span class="count" id="pick-count">0 / 10</span>
            </div>
          </div>
          <div class="card">
            <ol class="pick-list" id="pick-list"></ol>
            <p class="empty" id="picks-empty">Nothing picked yet. Add matches from the list.</p>
          </div>

          <form class="submit-form" id="submit-form">
            <label class="field">
              <span>Your email</span>
              <input type="email" name="email" id="submit-email" maxlength="254" autocomplete="email" placeholder="you@example.com" required />
            </label>
            <button type="submit" class="btn btn-primary" id="submit-btn">Submit</button>
          </form>
          <p class="toast" id="toast" role="status" aria-live="polite"></p>

          <div class="actions">
            <button type="button" class="link-btn" id="share-btn">Copy share link</button>
          </div>
        </section>

        <section class="catalog" aria-label="Matches">
          <ul class="match-list card" id="match-list"></ul>
        </section>
      </div>
    </main>

    <script src="config.js"></script>
    <script src="matches.js"></script>
    <script src="app.js"></script>
  </body>
</html>
