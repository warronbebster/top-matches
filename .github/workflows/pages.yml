# Publishes main to GitHub Pages at https://served.tennis/2026/.
# The gh-pages root holds the CNAME and a redirect to /2026/, and /2027/
# (the site's first address) redirects there too.
# PR previews live under pr-preview/ on the same branch and are left alone.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir -p _site/2026 _site/2027
          rsync -a --exclude .git --exclude .github --exclude _site --exclude apps-script ./ _site/2026/
          echo "served.tennis" > _site/CNAME
          # Redirect page; keeps the #list= share hash.
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8" />
          <title>Served</title>
          <link rel="canonical" href="/2026/" />
          <script>location.replace("/2026/" + location.hash);</script>
          <meta http-equiv="refresh" content="0; url=/2026/" />
          <a href="/2026/">Top matches</a>
          HTML
          cp _site/index.html _site/2027/index.html
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
          branch: gh-pages
          clean-exclude: pr-preview/
